<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS.COM Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a1a 100%);
        }
        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8844ff, #00ccff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(136, 68, 255, 0.3);
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-num {
            font-size: 2rem;
            font-weight: 700;
            color: #00ccff;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #666;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .game-card {
            background: #16161e;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #8844ff;
            box-shadow: 0 8px 30px rgba(136, 68, 255, 0.2);
        }
        .game-preview {
            height: 160px;
            background: #1e1e2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }
        .game-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, #16161e);
        }
        .game-info {
            padding: 16px;
        }
        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }
        .game-genre {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }
        .game-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .tag-sp { background: rgba(0, 204, 255, 0.15); color: #00ccff; }
        .tag-mp { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .tag-new { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        .section-title {
            max-width: 1200px;
            margin: 40px auto 20px;
            padding: 0 20px;
            font-size: 1.3rem;
            color: #8844ff;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 10px;
        }
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.85rem;
        }
        .footer a {
            color: #8844ff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .filter-bar {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            background: #1e1e2e;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #8844ff;
            color: #fff;
            border-color: #8844ff;
        }
        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .game-preview { height: 100px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">ALGOKOSMOS</div>
        <div class="subtitle">Open Source Game Platform</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-num">27</div>
                <div class="stat-label">Games</div>
            </div>
            <div class="stat">
                <div class="stat-num">6</div>
                <div class="stat-label">Multiplayer</div>
            </div>
            <div class="stat">
                <div class="stat-num">33</div>
                <div class="stat-label">Skills</div>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterGames('all')">All</button>
        <button class="filter-btn" onclick="filterGames('sp')">Singleplayer</button>
        <button class="filter-btn" onclick="filterGames('mp')">Multiplayer</button>
        <button class="filter-btn" onclick="filterGames('arcade')">Arcade</button>
        <button class="filter-btn" onclick="filterGames('puzzle')">Puzzle</button>
        <button class="filter-btn" onclick="filterGames('shooter')">Shooter</button>
        <button class="filter-btn" onclick="filterGames('platformer')">Platformer</button>
        <button class="filter-btn" onclick="filterGames('memory')">Memory</button>
        <button class="filter-btn" onclick="filterGames('logic')">Logic</button>
    </div>

    <h2 class="section-title">Singleplayer Games</h2>
    <div class="games-grid" id="sp-grid"></div>

    <h2 class="section-title">Multiplayer Games</h2>
    <div class="games-grid" id="mp-grid"></div>

    <div class="footer">
        <p>ALGOKOSMOS.COM &copy; 2026 | <a href="https://github.com/algocosmos/algocosmos-games">GitHub</a> | MIT License</p>
        <p style="margin-top: 8px;">Built with MiMo Code Agent</p>
    </div>

    <script>
    const games = [
        // Singleplayer
        { id: 'snake', title: 'Snake', genre: 'Arcade', icon: '🐍', type: 'sp', tags: ['arcade'] },
        { id: 'arkanoid', title: 'Arkanoid', genre: 'Arcade', icon: '🧱', type: 'sp', tags: ['arcade'] },
        { id: 'breakout', title: 'Breakout', genre: 'Arcade', icon: '💥', type: 'sp', tags: ['arcade'] },
        { id: 'tetris', title: 'Tetris', genre: 'Puzzle', icon: '🟦', type: 'sp', tags: ['puzzle'] },
        { id: 'space-invaders', title: 'Space Invaders', genre: 'Shooter', icon: '👾', type: 'sp', tags: ['shooter'] },
        { id: 'flappy-bird', title: 'Flappy Bird', genre: 'Arcade', icon: '🐦', type: 'sp', tags: ['arcade'] },
        { id: 'doodle-jump', title: 'Doodle Jump', genre: 'Platformer', icon: '🐸', type: 'sp', tags: ['platformer'] },
        { id: 'pacman', title: 'Pac-Man', genre: 'Maze', icon: '👻', type: 'sp', tags: ['arcade'] },
        { id: 'sokoban', title: 'Sokoban', genre: 'Puzzle', icon: '📦', type: 'sp', tags: ['puzzle'] },
        { id: 'frogger', title: 'Frogger', genre: 'Arcade', icon: '🐸', type: 'sp', tags: ['arcade'] },
        { id: 'asteroids', title: 'Asteroids', genre: 'Shooter', icon: '☄️', type: 'sp', tags: ['shooter'] },
        { id: 'centipede', title: 'Centipede', genre: 'Shooter', icon: '🐛', type: 'sp', tags: ['shooter'] },
        { id: 'contra', title: 'Contra', genre: 'Run-and-gun', icon: '🔫', type: 'sp', tags: ['shooter', 'platformer'] },
        { id: 'mario', title: 'Mario Bros', genre: 'Platformer', icon: '🍄', type: 'sp', tags: ['platformer'], isNew: true },
        { id: 'galaga', title: 'Galaga', genre: 'Shooter', icon: '🚀', type: 'sp', tags: ['shooter'], isNew: true },
        { id: 'prince-of-persia', title: 'Prince of Persia', genre: 'Platformer', icon: '⚔️', type: 'sp', tags: ['platformer'] },
        { id: 'krunker', title: 'Krunker FPS', genre: 'FPS', icon: '🎯', type: 'sp', tags: ['shooter'] },
        { id: 'claude-of-duty', title: 'Claude of Duty', genre: 'FPS', icon: '🎖️', type: 'sp', tags: ['shooter'] },
        { id: 'donkey-kong', title: 'Donkey Kong', genre: 'Platformer', icon: '🦍', type: 'sp', tags: ['platformer'], isNew: true },
        { id: 'minesweeper', title: 'Minesweeper', genre: 'Logic', icon: '💣', type: 'sp', tags: ['puzzle', 'logic'], isNew: true },
        { id: 'simon', title: 'Simon', genre: 'Memory', icon: '🧠', type: 'sp', tags: ['memory', 'arcade'], isNew: true },

        // Multiplayer
        { id: 'pong', title: 'Pong', genre: 'Sport', icon: '🏓', type: 'mp', tags: ['arcade'], modes: '1P / 2P Local' },
        { id: 'pong-online', title: 'Pong Online', genre: 'Sport', icon: '🏓', type: 'mp', tags: ['arcade'], modes: '1P / 1v1 Online' },
        { id: 'snake-arena', title: 'Snake Arena', genre: 'Arcade', icon: '🐍', type: 'mp', tags: ['arcade'], modes: '1P / 20+ Online' },
        { id: 'tetris-battle', title: 'Tetris Battle', genre: 'Puzzle', icon: '🟦', type: 'mp', tags: ['puzzle'], modes: '1P / 1v1 Online' },
        { id: 'tanks', title: 'Tanks', genre: 'Battle', icon: '🎖️', type: 'mp', tags: ['shooter'], modes: '1P / 2-8 Players' },
        { id: 'bomberman', title: 'Bomberman', genre: 'Action', icon: '💣', type: 'mp', tags: ['arcade'], modes: '1P / 2-4 Players' },
    ];

    function renderGames(filter = 'all') {
        const spGrid = document.getElementById('sp-grid');
        const mpGrid = document.getElementById('mp-grid');
        spGrid.innerHTML = '';
        mpGrid.innerHTML = '';

        games.forEach(g => {
            if (filter === 'sp' && g.type !== 'sp') return;
            if (filter === 'mp' && g.type !== 'mp') return;
            if (filter !== 'all' && filter !== 'sp' && filter !== 'mp' && !g.tags.includes(filter)) return;

            const card = document.createElement('a');
            card.className = 'game-card';
            card.href = `games/${g.id}/index.html`;
            card.innerHTML = `
                <div class="game-preview">${g.icon}</div>
                <div class="game-info">
                    <div class="game-title">${g.title}</div>
                    <div class="game-genre">${g.genre}${g.modes ? ' • ' + g.modes : ''}</div>
                    <div class="game-tags">
                        <span class="tag tag-${g.type}">${g.type === 'mp' ? 'Multiplayer' : 'Singleplayer'}</span>
                        ${g.isNew ? '<span class="tag tag-new">NEW</span>' : ''}
                    </div>
                </div>
            `;

            if (g.type === 'mp') {
                mpGrid.appendChild(card);
            } else {
                spGrid.appendChild(card);
            }
        });

        // Hide empty sections
        document.querySelector('.section-title:nth-of-type(1)').style.display = spGrid.children.length ? '' : 'none';
        document.querySelector('.section-title:nth-of-type(2)').style.display = mpGrid.children.length ? '' : 'none';
    }

    function filterGames(filter) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderGames(filter);
    }

    renderGames();
    </script>
</body>
</html>
