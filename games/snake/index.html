<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';
    import { GridMovement } from '../../engine/physics.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();
    const grid = new GridMovement(20);

    let snake = [], food = {}, score = 0, gameSpeed = 100;

    function initSnake() {
        snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * (game.w / grid.gridSize)),
            y: Math.floor(Math.random() * (game.h / grid.gridSize))
        };
    }

    game.update = function(dt) {
        grid.apply();
        const head = grid.moveHead(snake[0]);

        if (!grid.inBounds(head.x, head.y, game.w / grid.gridSize, game.h / grid.gridSize)) {
            audio.die(); game.stop(); ui.showGameOver(score, () => { score=0; initSnake(); spawnFood(); game.start(); });
            return;
        }
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            audio.die(); game.stop(); ui.showGameOver(score, () => { score=0; initSnake(); spawnFood(); game.start(); });
            return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10; audio.eat(); spawnFood();
            if (gameSpeed > 50) gameSpeed -= 2;
        } else {
            snake.pop();
        }
    };

    game.draw = function() {
        game.clear();
        r.drawGrid(game.w, game.h, grid.gridSize);
        r.circle(food.x * grid.gridSize + grid.gridSize/2, food.y * grid.gridSize + grid.gridSize/2, grid.gridSize/2 - 2, '#ff0055');
        snake.forEach((s, i) => r.rect(s.x * grid.gridSize, s.y * grid.gridSize, grid.gridSize - 2, grid.gridSize - 2, i === 0 ? '#00ff88' : '#00cc66'));
        ui.drawHUD(game.ctx, [{label:'Счёт',value:score,color:'#00ff88'},{label:'Длина',value:snake.length,color:'#00ff88'}]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === 'w') grid.setDirection('up');
        if (e.key === 'ArrowDown' || e.key === 's') grid.setDirection('down');
        if (e.key === 'ArrowLeft' || e.key === 'a') grid.setDirection('left');
        if (e.key === 'ArrowRight' || e.key === 'd') grid.setDirection('right');
    });

    input.on('touchend', (e, dx, dy) => {
        grid.setDirection(input.swipeDirection(dx, dy));
    });

    input.preventArrowScroll();
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Змейка — классика всех времён',
        color: '#00ff88',
        controls: '← → ↑ ↓ / WASD — движение | Свайп — мобильное управление',
        onStart: () => { initSnake(); spawnFood(); game.start(); }
    });
    </script>
</body>
</html>
