<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    let score = 0, frame = 0;
    const bird = { x: 150, y: 300, vy: 0, r: 15, gravity: 0.4, jump: -7, rotation: 0 };
    let pipes = [];
    const PW = 60, GAP = 160, SPEED = 3;
    let ground = 0;

    game.onResize(() => { ground = game.h - 60; });

    function flap() { bird.vy = bird.jump; audio.jump(); }

    function drawBird() {
        game.ctx.save();
        game.ctx.translate(bird.x, bird.y);
        game.ctx.rotate(bird.rotation);
        r.circle(0, 0, 18, '#00ff88', 15);
        r.circle(8, -4, 5, '#fff', 0);
        r.circle(9, -4, 2.5, '#000', 0);
        game.ctx.fillStyle = '#ff6600';
        game.ctx.beginPath(); game.ctx.moveTo(14, 0); game.ctx.lineTo(22, 2); game.ctx.lineTo(14, 5); game.ctx.closePath(); game.ctx.fill();
        game.ctx.restore();
    }

    function drawPipes() {
        pipes.forEach(p => {
            r.rect(p.x, 0, PW, p.top, '#00ccff', 10);
            r.rect(p.x + 5, p.top - 20, PW - 10, 20, '#0088aa', 0);
            r.rect(p.x, p.top + GAP, PW, game.h - p.top - GAP, '#00ccff', 10);
            r.rect(p.x + 5, p.top + GAP, PW - 10, 20, '#0088aa', 0);
        });
    }

    function drawGround() {
        r.rect(0, ground, game.w, game.h - ground, '#2a4a2a', 0);
        r.rect(0, ground, game.w, 10, '#3a5a3a', 0);
    }

    game.update = function() {
        frame++;
        bird.vy += bird.gravity;
        bird.y += bird.vy;
        bird.rotation = Math.min(Math.max(bird.vy * 0.05, -0.5), 1.2);

        if (frame % 90 === 0) {
            const top = 80 + Math.random() * (game.h - GAP - 200);
            pipes.push({ x: game.w, top, scored: false });
        }
        pipes.forEach(p => p.x -= SPEED);
        pipes = pipes.filter(p => p.x > -PW);

        pipes.forEach(p => {
            if (!p.scored && p.x + PW < bird.x) { p.scored = true; score++; audio.eat(); }
        });

        if (bird.y + bird.r > ground || bird.y - bird.r < 0) {
            audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;bird.y=game.h/2;bird.vy=0;pipes=[];frame=0;game.start(); });
            return;
        }
        pipes.forEach(p => {
            if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PW) {
                if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP) {
                    audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;bird.y=game.h/2;bird.vy=0;pipes=[];frame=0;game.start(); });
                }
            }
        });
    };

    game.draw = function() {
        r.gradientBg('#0a1a3a', '#2a3a2a');
        drawPipes();
        drawGround();
        drawBird();
        r.text(score.toString(), game.w / 2, 50, '#00ff88', 36, 'center');
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('keydown', e => { if (e.code === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); flap(); } });
    input.on('touchstart', () => flap());
    input.on('mousedown', () => flap());
    input.preventArrowScroll();
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Flappy Bird — пролети сквозь трубы!',
        color: '#00ff88',
        controls: 'Пробел / ↑ / Тач / Клик — прыжок',
        onStart: () => { bird.y = game.h / 2; bird.vy = 0; pipes = []; score = 0; frame = 0; game.start(); }
    });
    </script>
</body>
</html>
