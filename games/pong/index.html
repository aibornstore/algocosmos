<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';
    import { BallPhysics } from '../../engine/physics.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();
    const ball = new BallPhysics();

    const WIN = 7;
    const PW = 12, PH = 80;
    const p1 = { x: 30, y: 0, score: 0, dy: 0 };
    const p2 = { x: 0, y: 0, score: 0, dy: 0 };

    game.onResize(() => { p2.x = game.w - 30 - PW; });

    function resetBall() {
        ball.reset(game.w / 2, game.h / 2);
        ball.dx = 5 * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = 3 * (Math.random() > 0.5 ? 1 : -1);
    }

    function updatePaddle(p, dt) {
        p.y += p.dy * dt * 60;
        p.y = Math.max(0, Math.min(game.h - PH, p.y));
    }

    game.update = function(dt) {
        updatePaddle(p1, dt);
        // AI
        const target = ball.y - PH / 2;
        p2.dy = (target - p2.y) * 0.06;
        updatePaddle(p2, dt);

        ball.x += ball.dx;
        ball.y += ball.dy;
        if (ball.y - ball.r < 0 || ball.y + ball.r > game.h) ball.dy *= -1;

        if (ball.x - ball.r < p1.x + PW && ball.y > p1.y && ball.y < p1.y + PH) {
            ball.dx = Math.abs(ball.dx) * 1.05; ball.x = p1.x + PW + ball.r; audio.hit();
        }
        if (ball.x + ball.r > p2.x && ball.y > p2.y && ball.y < p2.y + PH) {
            ball.dx = -Math.abs(ball.dx) * 1.05; ball.x = p2.x - ball.r; audio.hit();
        }

        if (ball.x < 0) { p2.score++; resetBall(); }
        if (ball.x > game.w) { p1.score++; resetBall(); }

        if (p1.score >= WIN || p2.score >= WIN) {
            audio.win();
            game.stop();
            ui.showWin(p1.score >= WIN ? 'Игрок 1' : 'Игрок 2', () => { p1.score=0;p2.score=0;resetBall();game.start(); });
        }
    };

    game.draw = function() {
        game.clear();
        r.drawGrid(game.w, game.h, 0, '#333');
        ctx.setLineDash([10, 10]); ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(game.w/2, 0); ctx.lineTo(game.w/2, game.h); ctx.stroke();
        ctx.setLineDash([]);
        r.rect(p1.x, p1.y, PW, PH, '#00ffff');
        r.rect(p2.x, p2.y, PW, PH, '#ff00ff');
        r.circle(ball.x, ball.y, ball.r, '#ffffff', 20);
        r.text(`${p1.score} : ${p2.score}`, game.w/2, 30, '#fff', 24, 'center');
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    const ctx = game.ctx;

    input.on('keydown', e => {
        if (e.key === 'w' || e.key === 'W') p1.dy = -6;
        if (e.key === 's' || e.key === 'S') p1.dy = 6;
    });
    input.on('keyup', e => {
        if (['w','s','W','S'].includes(e.key)) p1.dy = 0;
    });
    input.preventArrowScroll();
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Pong — дуэль с AI',
        color: '#ffffff',
        controls: 'W/S — движение',
        onStart: () => { resetBall(); game.start(); }
    });
    </script>
</body>
</html>
