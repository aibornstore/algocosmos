<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Breakout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';
    import { BallPhysics } from '../../engine/physics.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();
    const ball = new BallPhysics();

    let score = 0, lives = 3;
    const paddle = { x: 0, y: 0, w: 100, h: 14 };
    let bricks = [];
    const ROWS = 6, COLS = 10, PAD = 4, OFFSET = 60, BH = 22;
    const colors = ['#ff0055','#ff6600','#ffcc00','#00ff88','#00ccff','#aa00ff'];

    function initBricks() {
        bricks = [];
        const bw = (game.w - 40) / COLS - PAD;
        for (let row = 0; row < ROWS; row++)
            for (let col = 0; col < COLS; col++)
                bricks.push({ x: 20 + col * (bw + PAD), y: OFFSET + row * (BH + PAD), w: bw, h: BH, color: colors[row], alive: true });
    }

    game.onResize(() => { paddle.y = game.h - 40; });

    game.update = function() {
        paddle.x = input.mouseX - paddle.w / 2;
        ball.update(1/60);
        ball.bounceWalls(game.w, game.h);

        if (ball.bouncePaddle(paddle, paddle.w, paddle.h)) audio.hit();

        if (ball.isBelow(game.h)) {
            lives--;
            if (lives <= 0) { audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;lives=3;initBricks();ball.reset(paddle.x+paddle.w/2,paddle.y-ball.r-5);game.start(); }); }
            else ball.reset(paddle.x + paddle.w/2, paddle.y - ball.r - 5);
        }

        bricks.forEach(b => {
            if (!b.alive) return;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
                ball.dy = -Math.abs(ball.dy);
                b.alive = false;
                score += 10;
                audio.eat();
            }
        });

        if (bricks.every(b => !b.alive)) {
            audio.win();
            initBricks();
            ball.reset(paddle.x + paddle.w/2, paddle.y - ball.r - 5);
        }
    };

    game.draw = function() {
        r.gradientBg('#0a0a2a', '#1a0a3a');
        bricks.forEach(b => { if (b.alive) r.rect(b.x, b.y, b.w, b.h, b.color, 8); });
        r.rect(paddle.x, paddle.y, paddle.w, paddle.h, '#ffcc00');
        r.circle(ball.x, ball.y, ball.r, '#ffffff', 20);
        ui.drawHUD(game.ctx, [{label:'Счёт',value:score,color:'#ffcc00'},{label:'Жизни',value:lives,color:'#ffcc00'}]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('touchmove', e => { paddle.x = e.touches[0].clientX - paddle.w / 2; });

    audio.init();
    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Breakout — разбей все кирпичи!',
        color: '#ffcc00',
        controls: 'Мышь / Тач — движение платформы',
        onStart: () => { initBricks(); ball.reset(paddle.x + paddle.w/2, paddle.y - ball.r - 5); game.start(); }
    });
    </script>
</body>
</html>
