<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Asteroids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    // SKILL: Ball physics pattern (from Pong/Breakout, Cycle 1-2)
    // Adapted for asteroids: wrap around screen edges

    let ship = {};
    let asteroids = [];
    let bullets = [];
    let particles = [];
    let score = 0, lives = 3, level = 1;
    let thrusting = false, turningLeft = false, turningRight = false;

    function initShip() {
        ship = {
            x: game.w / 2, y: game.h / 2,
            vx: 0, vy: 0,
            angle: -Math.PI / 2, // pointing up
            thrust: 200,
            turnSpeed: 4,
            radius: 12,
            invincible: 3,
            dead: false
        };
    }

    function createAsteroid(x, y, size) {
        // size: 3=large, 2=medium, 1=small
        const speed = (4 - size) * 0.5 + Math.random() * 0.5;
        const angle = Math.random() * Math.PI * 2;
        // Generate random polygon shape
        const points = [];
        const numPoints = 8 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numPoints; i++) {
            const a = (i / numPoints) * Math.PI * 2;
            const r = (size * 12) * (0.7 + Math.random() * 0.3);
            points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        return {
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size,
            radius: size * 12,
            points,
            angle: 0,
            spin: (Math.random() - 0.5) * 2
        };
    }

    function spawnWave() {
        asteroids = [];
        const count = 3 + level;
        for (let i = 0; i < count; i++) {
            let x, y;
            do {
                x = Math.random() * game.w;
                y = Math.random() * game.h;
            } while (Math.abs(x - ship.x) < 150 && Math.abs(y - ship.y) < 150);
            asteroids.push(createAsteroid(x, y, 3));
        }
    }

    function shoot() {
        if (ship.dead) return;
        if (bullets.length >= 8) return; // max bullets
        bullets.push({
            x: ship.x + Math.cos(ship.angle) * ship.radius,
            y: ship.y + Math.sin(ship.angle) * ship.radius,
            vx: Math.cos(ship.angle) * 8,
            vy: Math.sin(ship.angle) * 8,
            life: 1.5
        });
        audio.shoot();
    }

    function explode(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 50 + Math.random() * 100;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5 + Math.random() * 0.5,
                color: color || '#ffcc00'
            });
        }
    }

    function die() {
        if (ship.invincible > 0) return;
        ship.dead = true;
        lives--;
        audio.die();
        explode(ship.x, ship.y, 20, '#00ccff');
        if (lives <= 0) {
            game.stop();
            ui.showGameOver(score, () => { score = 0; lives = 3; level = 1; initShip(); spawnWave(); bullets = []; particles = []; game.start(); });
        } else {
            setTimeout(() => {
                ship.dead = false;
                ship.x = game.w / 2; ship.y = game.h / 2;
                ship.vx = 0; ship.vy = 0;
                ship.angle = -Math.PI / 2;
                ship.invincible = 3;
            }, 1500);
        }
    }

    // SKILL: Screen wrap (from Snake Arena, Cycle 2)
    function wrap(obj) {
        if (obj.x < -20) obj.x = game.w + 20;
        if (obj.x > game.w + 20) obj.x = -20;
        if (obj.y < -20) obj.y = game.h + 20;
        if (obj.y > game.h + 20) obj.y = -20;
    }

    // ===== UPDATE =====
    game.update = function(dt) {
        ship.invincible = Math.max(0, ship.invincible - dt);

        // Ship rotation
        if (turningLeft) ship.angle -= ship.turnSpeed * dt;
        if (turningRight) ship.angle += ship.turnSpeed * dt;

        // Ship thrust
        if (thrusting) {
            ship.vx += Math.cos(ship.angle) * ship.thrust * dt;
            ship.vy += Math.sin(ship.angle) * ship.thrust * dt;
        }
        // Friction
        ship.vx *= 0.99;
        ship.vy *= 0.99;

        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;
        wrap(ship);

        // Bullets
        bullets.forEach(b => {
            b.x += b.vx * dt * 60;
            b.y += b.vy * dt * 60;
            b.life -= dt;
            wrap(b);
        });
        bullets = bullets.filter(b => b.life > 0);

        // Asteroids
        asteroids.forEach(a => {
            a.x += a.vx * dt * 60;
            a.y += a.vy * dt * 60;
            a.angle += a.spin * dt;
            wrap(a);
        });

        // Bullet-asteroid collision
        bullets.forEach(b => {
            asteroids.forEach(a => {
                if (a.dead) return;
                const dx = b.x - a.x, dy = b.y - a.y;
                if (dx * dx + dy * dy < a.radius * a.radius) {
                    b.life = 0;
                    a.dead = true;
                    score += (4 - a.size) * 50;
                    audio.hit();
                    explode(a.x, a.y, 6, '#888');

                    // Split asteroid
                    if (a.size > 1) {
                        for (let i = 0; i < 2; i++) {
                            asteroids.push(createAsteroid(a.x, a.y, a.size - 1));
                        }
                    }
                }
            });
        });
        asteroids = asteroids.filter(a => !a.dead);

        // Ship-asteroid collision
        if (!ship.dead && ship.invincible <= 0) {
            asteroids.forEach(a => {
                const dx = ship.x - a.x, dy = ship.y - a.y;
                if (dx * dx + dy * dy < (ship.radius + a.radius) * (ship.radius + a.radius)) {
                    die();
                }
            });
        }

        // Wave complete
        if (asteroids.length === 0) {
            level++;
            spawnWave();
            audio.win();
        }

        // Particles
        particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
        particles = particles.filter(p => p.life > 0);
    };

    // ===== DRAW =====
    game.draw = function() {
        const ctx = game.ctx;
        ctx.fillStyle = '#000011';
        ctx.fillRect(0, 0, game.w, game.h);

        // Asteroids
        asteroids.forEach(a => {
            ctx.strokeStyle = '#aaaacc';
            ctx.lineWidth = 2;
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            ctx.moveTo(a.points[0].x, a.points[0].y);
            for (let i = 1; i < a.points.length; i++) ctx.lineTo(a.points[i].x, a.points[i].y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        });

        // Bullets
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 6;
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;

        // Ship
        if (!ship.dead && (ship.invincible <= 0 || Math.sin(Date.now() / 80) > 0)) {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            ctx.strokeStyle = '#00ccff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00ccff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(ship.radius, 0);
            ctx.lineTo(-ship.radius * 0.7, -ship.radius * 0.6);
            ctx.lineTo(-ship.radius * 0.4, 0);
            ctx.lineTo(-ship.radius * 0.7, ship.radius * 0.6);
            ctx.closePath();
            ctx.stroke();
            // Thrust flame
            if (thrusting) {
                ctx.strokeStyle = '#ff8800';
                ctx.beginPath();
                ctx.moveTo(-ship.radius * 0.4, -4);
                ctx.lineTo(-ship.radius * (0.8 + Math.random() * 0.4), 0);
                ctx.lineTo(-ship.radius * 0.4, 4);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life * 2);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
        });
        ctx.globalAlpha = 1;

        // HUD
        ui.drawHUD(game.ctx, [
            { label: 'Счёт', value: score, color: '#00ccff' },
            { label: 'Жизни', value: lives, color: '#00ccff' },
            { label: 'Уровень', value: level, color: '#ffcc00' }
        ]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    // ===== INPUT =====
    document.addEventListener('keydown', e => {
        switch(e.key) {
            case 'ArrowLeft': case 'a': turningLeft = true; break;
            case 'ArrowRight': case 'd': turningRight = true; break;
            case 'ArrowUp': case 'w': thrusting = true; break;
            case ' ': shoot(); e.preventDefault(); break;
            case 'p': game.pause(); break;
        }
    });
    document.addEventListener('keyup', e => {
        switch(e.key) {
            case 'ArrowLeft': case 'a': turningLeft = false; break;
            case 'ArrowRight': case 'd': turningRight = false; break;
            case 'ArrowUp': case 'w': thrusting = false; break;
        }
    });
    input.preventArrowScroll();
    audio.init();

    // Touch
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const x = e.touches[0].clientX;
        if (x < game.w * 0.3) turningLeft = true;
        else if (x > game.w * 0.7) turningRight = true;
        else thrusting = true;
    });
    canvas.addEventListener('touchend', e => {
        turningLeft = false; turningRight = false; thrusting = false;
        shoot();
    });

    // ===== START =====
    ui.showStart({
        title: 'ASTEROIDS',
        subtitle: 'ALGOKOSMOS Edition',
        description: 'Классический космический аркадный шутер!',
        color: '#00ccff',
        controls: '← → поворот | ↑ тяга | Пробел выстрел',
        onStart: () => { initShip(); level = 1; spawnWave(); score = 0; lives = 3; bullets = []; particles = []; game.start(); }
    });
    </script>
</body>
</html>
