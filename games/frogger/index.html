<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Frogger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    // SKILL: Shared engine import pattern (from Cycle 2)
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    const TILE = 40;
    const COLS = 15;
    const ROWS = 13;

    let player = {};
    let vehicles = []; // cars, trucks
    let logs = [];     // floating logs
    let turtles = [];
    let score = 0, lives = 3, level = 1;
    let homeSlots = [false, false, false, false, false]; // 5 home slots

    // SKILL: Grid movement (from Snake, Cycle 1)
    function initPlayer() {
        player = {
            x: 7, y: 12, // grid position
            targetX: 7, targetY: 12,
            moving: false, moveTimer: 0,
            onLog: false, logSpeed: 0,
            dead: false, deadTimer: 0
        };
    }

    // Row definitions: type, speed, objects
    // 0=road, 1=river, 2=safe, 3=home
    const rowConfig = [
        { type: 3, label: 'home' },      // row 0 - home
        { type: 1, speed: 1.5, dir: 1, objs: 'log3' },   // row 1
        { type: 1, speed: -1, dir: -1, objs: 'turtle4' }, // row 2
        { type: 1, speed: 2, dir: 1, objs: 'log4' },     // row 3
        { type: 1, speed: -1.5, dir: -1, objs: 'log2' }, // row 4
        { type: 1, speed: 1, dir: 1, objs: 'turtle3' },  // row 5
        { type: 2, label: 'safe' },      // row 6 - safe median
        { type: 0, speed: -2, dir: -1, objs: 'car3' },   // row 7
        { type: 0, speed: 1.5, dir: 1, objs: 'truck2' }, // row 8
        { type: 0, speed: -1, dir: -1, objs: 'car2' },   // row 9
        { type: 0, speed: 2.5, dir: 1, objs: 'car4' },   // row 10
        { type: 0, speed: -1.5, dir: -1, objs: 'truck1' }, // row 11
        { type: 2, label: 'start' },     // row 12 - start
    ];

    function spawnRowObjects() {
        vehicles = [];
        logs = [];
        turtles = [];
        for (let y = 0; y < ROWS; y++) {
            const cfg = rowConfig[y];
            if (cfg.type === 0) { // road - vehicles
                const parts = cfg.objs.match(/(car|truck)(\d+)/);
                const count = parseInt(parts[2]);
                const w = parts[1] === 'truck' ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    vehicles.push({
                        x: i * (COLS / count) + Math.random() * 2,
                        y, w, h: 1,
                        speed: cfg.speed * (0.8 + Math.random() * 0.4),
                        color: parts[1] === 'truck' ? '#ff4444' : ['#ffcc00','#00ccff','#ff00ff','#00ff88'][Math.floor(Math.random()*4)]
                    });
                }
            } else if (cfg.type === 1) { // river - logs/turtles
                const parts = cfg.objs.match(/(log|turtle)(\d+)/);
                const count = parseInt(parts[2]);
                const w = parts[1] === 'log' ? 3 : 2;
                for (let i = 0; i < count; i++) {
                    const obj = {
                        x: i * (COLS / count) + Math.random() * 2,
                        y, w, h: 1,
                        speed: cfg.speed,
                        type: parts[1],
                        color: parts[1] === 'log' ? '#885533' : '#008844',
                        diving: false, diveTimer: 0
                    };
                    if (parts[1] === 'turtle') turtles.push(obj);
                    else logs.push(obj);
                }
            }
        }
    }

    function movePlayer(dx, dy) {
        if (player.moving || player.dead) return;
        const nx = player.x + dx;
        const ny = player.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
        player.targetX = nx;
        player.targetY = ny;
        player.moving = true;
        player.moveTimer = 0.1;
        audio.jump();
        // Score for forward progress
        if (dy < 0 && ny < player.y) score += 10;
    }

    // SKILL: AABB collision (from Physics module, Cycle 2)
    function checkVehicleCollision() {
        const px = player.x, py = player.y;
        return vehicles.some(v =>
            py === v.y &&
            px < v.x + v.w &&
            px + 1 > v.x
        );
    }

    function checkRiverDeath() {
        const py = player.y;
        const cfg = rowConfig[py];
        if (cfg.type !== 1) return false;
        // Check if on a log or turtle
        const onLog = logs.some(l => py === l.y && player.x < l.x + l.w && player.x + 1 > l.x);
        const onTurtle = turtles.some(t => py === t.y && !t.diving && player.x < t.x + t.w && player.x + 1 > t.x);
        return !onLog && !onTurtle;
    }

    function getLogSpeed() {
        const py = player.y;
        const log = logs.find(l => py === l.y && player.x < l.x + l.w && player.x + 1 > l.x);
        if (log) return log.speed;
        const turtle = turtles.find(t => py === t.y && !t.diving && player.x < t.x + t.w && player.x + 1 > t.x);
        if (turtle) return turtle.speed;
        return 0;
    }

    function checkHome() {
        if (player.y !== 0) return;
        // Check home slots (columns 2, 5, 8, 11, 14)
        const homeCols = [2, 5, 8, 11, 14];
        const slotIdx = homeCols.indexOf(player.x);
        if (slotIdx >= 0 && !homeSlots[slotIdx]) {
            homeSlots[slotIdx] = true;
            score += 200;
            audio.win();
            // Check if all homes filled
            if (homeSlots.every(h => h)) {
                level++;
                homeSlots = [false, false, false, false, false];
                score += 1000;
            }
            // Reset player
            player.x = 7; player.y = 12;
            player.targetX = 7; player.targetY = 12;
        } else {
            // Die if hitting wall or wrong slot
            die();
        }
    }

    function die() {
        player.dead = true;
        player.deadTimer = 1;
        lives--;
        audio.die();
        if (lives <= 0) {
            game.stop();
            ui.showGameOver(score, () => { score = 0; lives = 3; level = 1; homeSlots = [false,false,false,false,false]; initPlayer(); spawnRowObjects(); game.start(); });
        }
    }

    // ===== UPDATE =====
    game.update = function(dt) {
        if (player.dead) {
            player.deadTimer -= dt;
            if (player.deadTimer <= 0) {
                player.dead = false;
                player.x = 7; player.y = 12;
                player.targetX = 7; player.targetY = 12;
            }
            return;
        }

        // Move player
        if (player.moving) {
            player.moveTimer -= dt;
            if (player.moveTimer <= 0) {
                player.x = player.targetX;
                player.y = player.targetY;
                player.moving = false;
                checkHome();
            }
        }

        // Move vehicles
        vehicles.forEach(v => {
            v.x += v.speed * dt;
            if (v.x > COLS + 2) v.x = -v.w - 1;
            if (v.x < -v.w - 2) v.x = COLS + 1;
        });

        // Move logs
        logs.forEach(l => {
            l.x += l.speed * dt;
            if (l.x > COLS + 2) l.x = -l.w - 1;
            if (l.x < -l.w - 2) l.x = COLS + 1;
        });

        // Move turtles (with diving)
        turtles.forEach(t => {
            t.x += t.speed * dt;
            if (t.x > COLS + 2) t.x = -t.w - 1;
            if (t.x < -t.w - 2) t.x = COLS + 1;
            // Diving
            t.diveTimer += dt;
            if (t.diveTimer > 5 + Math.random() * 3) {
                t.diving = !t.diving;
                t.diveTimer = 0;
            }
        });

        // Player rides on logs/turtles
        if (!player.moving) {
            const logSpeed = getLogSpeed();
            player.x += logSpeed * dt;
            if (player.x < 0 || player.x >= COLS) { die(); return; }
        }

        // Check collisions
        if (!player.moving && checkVehicleCollision()) { die(); return; }
        if (!player.moving && checkRiverDeath()) { die(); return; }

        // Turtles drown player when diving
        if (!player.moving) {
            const py = player.y;
            const onDivingTurtle = turtles.some(t => py === t.y && t.diving && player.x < t.x + t.w && player.x + 1 > t.x);
            if (onDivingTurtle && rowConfig[py].type === 1) { die(); return; }
        }
    };

    // ===== DRAW =====
    game.draw = function() {
        const ctx = game.ctx;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, game.w, game.h);

        // Center map
        const ox = (game.w - COLS * TILE) / 2;
        const oy = (game.h - ROWS * TILE) / 2;

        // Draw rows
        for (let y = 0; y < ROWS; y++) {
            const cfg = rowConfig[y];
            const sy = oy + y * TILE;
            if (cfg.type === 0) { // Road
                ctx.fillStyle = '#333';
                ctx.fillRect(ox, sy, COLS * TILE, TILE);
                ctx.strokeStyle = '#555';
                ctx.setLineDash([10, 10]);
                ctx.beginPath(); ctx.moveTo(ox, sy + TILE/2); ctx.lineTo(ox + COLS * TILE, sy + TILE/2); ctx.stroke();
                ctx.setLineDash([]);
            } else if (cfg.type === 1) { // River
                ctx.fillStyle = '#0044aa';
                ctx.fillRect(ox, sy, COLS * TILE, TILE);
            } else if (cfg.type === 2) { // Safe
                ctx.fillStyle = '#333333';
                ctx.fillRect(ox, sy, COLS * TILE, TILE);
            } else if (cfg.type === 3) { // Home
                ctx.fillStyle = '#002200';
                ctx.fillRect(ox, sy, COLS * TILE, TILE);
                // Draw home slots
                const homeCols = [2, 5, 8, 11, 14];
                homeCols.forEach((hx, i) => {
                    ctx.fillStyle = homeSlots[i] ? '#00ff88' : '#004400';
                    ctx.fillRect(ox + hx * TILE, sy, TILE, TILE);
                    ctx.strokeStyle = '#008800';
                    ctx.strokeRect(ox + hx * TILE, sy, TILE, TILE);
                });
            }
        }

        // Draw vehicles
        vehicles.forEach(v => {
            ctx.fillStyle = v.color;
            ctx.fillRect(ox + v.x * TILE, oy + v.y * TILE, v.w * TILE - 2, TILE - 4);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(ox + v.x * TILE, oy + v.y * TILE, v.w * TILE - 2, TILE - 4);
            // Windows
            ctx.fillStyle = '#aaddff';
            for (let i = 0; i < v.w; i++) {
                ctx.fillRect(ox + (v.x + i) * TILE + 4, oy + v.y * TILE + 4, TILE - 10, TILE/2 - 4);
            }
        });

        // Draw logs
        logs.forEach(l => {
            ctx.fillStyle = l.color;
            ctx.fillRect(ox + l.x * TILE, oy + l.y * TILE + 2, l.w * TILE - 2, TILE - 4);
            ctx.strokeStyle = '#664422';
            ctx.strokeRect(ox + l.x * TILE, oy + l.y * TILE + 2, l.w * TILE - 2, TILE - 4);
            // Wood grain
            ctx.strokeStyle = '#775533';
            for (let i = 0; i < l.w; i++) {
                ctx.beginPath();
                ctx.moveTo(ox + (l.x + i) * TILE + 5, oy + l.y * TILE + 8);
                ctx.lineTo(ox + (l.x + i) * TILE + TILE - 5, oy + l.y * TILE + 8);
                ctx.stroke();
            }
        });

        // Draw turtles
        turtles.forEach(t => {
            if (t.diving) {
                ctx.fillStyle = '#006633';
                ctx.globalAlpha = 0.4;
            } else {
                ctx.fillStyle = t.color;
            }
            ctx.fillRect(ox + t.x * TILE, oy + t.y * TILE + 2, t.w * TILE - 2, TILE - 4);
            ctx.globalAlpha = 1;
            // Shell pattern
            ctx.strokeStyle = '#006633';
            ctx.beginPath();
            ctx.arc(ox + t.x * TILE + t.w * TILE/2 - 1, oy + t.y * TILE + TILE/2, 8, 0, Math.PI * 2);
            ctx.stroke();
        });

        // Draw player
        if (!player.dead) {
            const px = ox + player.x * TILE;
            const py = oy + player.y * TILE;
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 10;
            // Frog body
            ctx.beginPath();
            ctx.ellipse(px + TILE/2, py + TILE/2, 12, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px + 12, py + 10, 4, 0, Math.PI * 2);
            ctx.arc(px + TILE - 12, py + 10, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(px + 13, py + 10, 2, 0, Math.PI * 2);
            ctx.arc(px + TILE - 11, py + 10, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            // Death animation
            const px = ox + player.x * TILE;
            const py = oy + player.y * TILE;
            ctx.fillStyle = '#ff0000';
            ctx.globalAlpha = player.deadTimer;
            ctx.beginPath();
            ctx.ellipse(px + TILE/2, py + TILE/2, 14, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // HUD
        ui.drawHUD(game.ctx, [
            { label: 'Счёт', value: score, color: '#00ff00' },
            { label: 'Жизни', value: lives, color: '#00ff00' },
            { label: 'Уровень', value: level, color: '#ffcc00' }
        ]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    // ===== INPUT =====
    // SKILL: Grid movement input (from Snake, Cycle 1)
    document.addEventListener('keydown', e => {
        switch(e.key) {
            case 'ArrowUp': case 'w': movePlayer(0, -1); e.preventDefault(); break;
            case 'ArrowDown': case 's': movePlayer(0, 1); e.preventDefault(); break;
            case 'ArrowLeft': case 'a': movePlayer(-1, 0); e.preventDefault(); break;
            case 'ArrowRight': case 'd': movePlayer(1, 0); e.preventDefault(); break;
            case 'p': game.pause(); break;
        }
    });
    input.preventArrowScroll();
    audio.init();

    // Touch
    let tsx, tsy;
    canvas.addEventListener('touchstart', e => { e.preventDefault(); tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tsx;
        const dy = e.changedTouches[0].clientY - tsy;
        if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 1 : -1, 0);
        else movePlayer(0, dy > 0 ? 1 : -1);
    });

    // ===== START =====
    ui.showStart({
        title: 'FROGGER',
        subtitle: 'ALGOKOSMOS Edition',
        description: 'Перебегай дорогу и реку! Доберись до всех домиков!',
        color: '#00ff00',
        controls: '← → ↑ ↓ движение | P пауза | Цель: 5 домиков',
        onStart: () => {
            initPlayer();
            spawnRowObjects();
            score = 0; lives = 3; level = 1;
            homeSlots = [false, false, false, false, false];
            game.start();
        }
    });
    </script>
</body>
</html>
