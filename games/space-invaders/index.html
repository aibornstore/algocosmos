<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Space Invaders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    let score = 0, lives = 3, wave = 1;
    const player = { x: 0, y: 0, speed: 7 };
    let bullets = [], enemyBullets = [], enemies = [];
    let enemyDir = 1, enemySpeed = 1;
    let stars = [];
    let moveLeft = false, moveRight = false;

    function initEnemies() {
        enemies = [];
        const rows = 3 + Math.min(wave, 3);
        for (let row = 0; row < rows; row++)
            for (let col = 0; col < 8; col++)
                enemies.push({ x: 50 + col * 60, y: 50 + row * 40, alive: true, type: row % 3 });
    }

    game.onResize(() => { player.y = game.h - 50; player.x = game.w / 2; });
    stars = r.makeStars(100, game.w, game.h);

    game.update = function(dt) {
        if (moveLeft) player.x -= player.speed;
        if (moveRight) player.x += player.speed;
        player.x = Math.max(25, Math.min(game.w - 25, player.x));

        // Bullets
        bullets.forEach(b => b.y -= 10);
        bullets = bullets.filter(b => b.y > 0);
        enemyBullets.forEach(b => b.y += 5);
        enemyBullets = enemyBullets.filter(b => b.y < game.h);

        // Enemies
        let hitEdge = false;
        enemies.forEach(e => { if (e.alive) { e.x += enemyDir * enemySpeed; if (e.x < 30 || e.x > game.w - 30) hitEdge = true; } });
        if (hitEdge) { enemyDir *= -1; enemies.forEach(e => { if (e.alive) e.y += 20; }); }

        if (Math.random() < 0.02) {
            const alive = enemies.filter(e => e.alive);
            if (alive.length > 0) {
                const s = alive[Math.floor(Math.random() * alive.length)];
                enemyBullets.push({ x: s.x, y: s.y + 15 });
            }
        }

        // Collisions
        bullets.forEach((b, bi) => {
            enemies.forEach((e, ei) => {
                if (e.alive && b.x > e.x - 20 && b.x < e.x + 20 && b.y > e.y - 15 && b.y < e.y + 15) {
                    e.alive = false; bullets.splice(bi, 1);
                    score += 10 * (e.type + 1);
                    document.getElementById('score').textContent = score;
                    audio.hit();
                }
            });
        });

        enemyBullets.forEach((b, i) => {
            if (b.x > player.x - 25 && b.x < player.x + 25 && b.y > player.y - 15 && b.y < player.y + 15) {
                enemyBullets.splice(i, 1); lives--;
                document.getElementById('lives').textContent = lives;
                if (lives <= 0) { audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;lives=3;wave=1;initEnemies();game.start(); }); }
            }
        });

        enemies.forEach(e => { if (e.alive && e.y + 15 > player.y - 20) { audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;lives=3;wave=1;initEnemies();game.start(); }); } });

        if (enemies.every(e => !e.alive)) {
            wave++; document.getElementById('wave').textContent = wave;
            enemySpeed = 1 + wave * 0.3; initEnemies(); audio.win();
        }
    };

    game.draw = function() {
        r.gradientBg('#0a0a2a', '#1a0a3a');
        r.drawStars(stars, 0);

        // Player ship
        const ctx = game.ctx;
        ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.moveTo(player.x, player.y - 15); ctx.lineTo(player.x - 25, player.y + 15); ctx.lineTo(player.x + 25, player.y + 15); ctx.closePath(); ctx.fill();
        r.circle(player.x, player.y, 5, '#ffffff', 0);

        // Enemies
        const colors = ['#ff0066', '#ff6600', '#ffff00'];
        enemies.forEach(e => { if (e.alive) r.rect(e.x - 20, e.y - 15, 40, 30, colors[e.type], 10); });

        // Bullets
        bullets.forEach(b => r.rect(b.x - 2, b.y, 4, 15, '#00ffff', 10));
        enemyBullets.forEach(b => r.rect(b.x - 2, b.y, 4, 15, '#ff0066', 10));

        ui.drawHUD(game.ctx, [{label:'Счёт',value:score,color:'#ff00ff'},{label:'Жизни',value:lives,color:'#ff00ff'},{label:'Волна',value:wave,color:'#ff00ff'}]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
        if (e.key === ' ' || e.key === 'ArrowUp') { bullets.push({ x: player.x, y: player.y - 15 }); audio.shoot(); }
    });
    input.on('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });
    input.on('touchmove', e => { player.x = e.touches[0].clientX; });
    input.on('touchstart', () => { bullets.push({ x: player.x, y: player.y - 15 }); audio.shoot(); });
    input.preventArrowScroll();
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Space Invaders — защити Землю!',
        color: '#ff00ff',
        controls: '← → движение | Пробел/↑ — выстрел',
        onStart: () => { initEnemies(); player.x = game.w / 2; game.start(); }
    });
    </script>
</body>
</html>
