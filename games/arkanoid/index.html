<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Arkanoid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    let score = 0, lives = 3, level = 1;
    const paddle = { x: 0, y: 0, w: 100, h: 15 };
    const ball = { x: 0, y: 0, r: 8, dx: 5, dy: -5 };
    let bricks = [];
    const ROWS = 5, COLS = 8, BW = 70, BH = 25, PAD = 5, OFFSET = 60;
    const colors = ['#ff0055','#ff6600','#ffcc00','#00ff88','#00ccff'];

    function initBricks() {
        bricks = [];
        for (let row = 0; row < ROWS; row++)
            for (let col = 0; col < COLS; col++)
                bricks.push({ x: 35 + col * (BW + PAD), y: OFFSET + row * (BH + PAD), w: BW, h: BH, color: colors[row], alive: true });
    }

    function resetBall() {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 5;
        ball.dx = 5 * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -5;
    }

    game.onResize(() => { paddle.y = game.h - 40; });

    game.update = function() {
        paddle.x = input.mouseX - paddle.w / 2;
        ball.x += ball.dx; ball.y += ball.dy;

        if (ball.x - ball.r < 0 || ball.x + ball.r > game.w) ball.dx *= -1;
        if (ball.y - ball.r < 0) ball.dy *= -1;

        if (ball.y + ball.r > game.h) {
            lives--;
            document.getElementById('lives').textContent = lives;
            if (lives <= 0) { audio.die(); game.stop(); ui.showGameOver(score, () => { score=0;lives=3;level=1;initBricks();resetBall();game.start(); }); }
            else resetBall();
        }

        if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
            ball.dy = -ball.dy;
            const hit = (ball.x - paddle.x) / (paddle.w/2);
            ball.dx = hit * 5;
            audio.hit();
        }

        bricks.forEach(b => {
            if (!b.alive) return;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
                ball.dy *= -1; b.alive = false; score += 10;
                document.getElementById('score').textContent = score;
                audio.eat();
            }
        });

        if (bricks.every(b => !b.alive)) {
            level++; document.getElementById('level').textContent = level;
            ball.dx *= 1.1; ball.dy *= 1.1;
            initBricks(); resetBall(); audio.win();
        }
    };

    game.draw = function() {
        r.gradientBg('#0a0a2a', '#1a0a3a');
        bricks.forEach(b => { if (b.alive) r.rect(b.x, b.y, b.w, b.h, b.color, 10); });
        r.rect(paddle.x, paddle.y, paddle.w, paddle.h, '#00ffff');
        r.circle(ball.x, ball.y, ball.r, '#ffffff', 20);
        ui.drawHUD(game.ctx, [{label:'Счёт',value:score,color:'#00ffff'},{label:'Жизни',value:lives,color:'#00ffff'},{label:'Уровень',value:level,color:'#00ffff'}]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('touchmove', e => { paddle.x = e.touches[0].clientX - paddle.w / 2; });
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Арканоид — классика в новом исполнении',
        color: '#00ffff',
        controls: 'Мышь / Тач — движение платформы',
        onStart: () => { initBricks(); resetBall(); game.start(); }
    });
    </script>
</body>
</html>
