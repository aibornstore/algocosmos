<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGOKOSMOS Doodle Jump</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #gameCanvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
    import { Game } from '../../engine/core.js';
    import { Input } from '../../engine/input.js';
    import { UI } from '../../engine/ui.js';
    import { Renderer } from '../../engine/renderer.js';
    import { Audio } from '../../engine/audio.js';

    const game = new Game();
    const input = new Input(game.canvas);
    const ui = new UI(game);
    const r = new Renderer(game.ctx);
    const audio = new Audio();

    let score = 0, maxHeight = 0;
    const player = { x: 200, y: 400, vx: 0, vy: 0, jumpForce: -12, gravity: 0.5 };
    let platforms = [];
    const PW = 70, PH = 15;
    let stars = [];

    function generatePlatform(y) {
        const types = ['normal','normal','normal','moving','fragile'];
        const type = types[Math.floor(Math.random() * types.length)];
        return { x: Math.random() * (game.w - PW), y, width: PW, height: PH, type, speed: type === 'moving' ? (Math.random()*2+1)*(Math.random()>0.5?1:-1) : 0, broken: false };
    }

    function initPlatforms() {
        platforms = [{ x: game.w/2 - PW/2, y: game.h - 100, width: PW, height: PH, type: 'normal', speed: 0, broken: false }];
        for (let i = 0; i < 10; i++) platforms.push(generatePlatform(game.h - 150 - i * 80));
    }

    stars = r.makeStars(50, game.w, game.h);

    game.update = function() {
        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;

        if (player.x < -20) player.x = game.w + 20;
        if (player.x > game.w + 20) player.x = -20;

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (p.type === 'fragile' && p.broken) return;
                if (player.x > p.x - 10 && player.x < p.x + p.width + 10 && player.y + 20 > p.y && player.y + 20 < p.y + p.height + 10) {
                    if (p.type === 'fragile') p.broken = true;
                    player.y = p.y - 20;
                    player.vy = player.jumpForce;
                    audio.jump();
                }
            });
        }

        const h = Math.floor((game.h - player.y) / 10);
        if (h > maxHeight) { maxHeight = h; score = maxHeight; }

        platforms.forEach(p => {
            if (p.type === 'moving') {
                p.x += p.speed;
                if (p.x < 0 || p.x > game.w - p.width) p.speed *= -1;
            }
        });

        if (player.y < game.h / 3) {
            const scroll = game.h / 3 - player.y;
            player.y = game.h / 3;
            platforms.forEach(p => p.y += scroll);
            platforms = platforms.filter(p => p.y < game.h);
            while (platforms.length < 10) {
                const highest = Math.min(...platforms.map(p => p.y));
                platforms.push(generatePlatform(highest - 80));
            }
        }

        if (player.y > game.h + 50) {
            audio.die(); game.stop();
            ui.showGameOver(score, () => { score=0;maxHeight=0;player.x=game.w/2;player.y=game.h-100;player.vx=0;player.vy=0;initPlatforms();game.start(); });
        }
    };

    game.draw = function() {
        r.gradientBg('#1a0a3a', '#0a2a1a');
        r.drawStars(stars, 0);

        platforms.forEach(p => {
            if (p.type === 'fragile' && p.broken) return;
            const color = p.type === 'normal' ? '#00cc66' : p.type === 'moving' ? '#00ccff' : '#ffcc00';
            r.rect(p.x, p.y, p.width, p.height, color, 10);
        });

        // Player
        r.rect(player.x - 15, player.y - 20, 30, 35, '#00ff00', 15);
        r.rect(player.x - 8, player.y - 15, 6, 6, '#ffffff', 0);
        r.rect(player.x + 2, player.y - 15, 6, 6, '#ffffff', 0);
        r.rect(player.x - 6, player.y - 13, 3, 3, '#000', 0);
        r.rect(player.x + 4, player.y - 13, 3, 3, '#000', 0);
        r.rect(player.x - 2, player.y - 5, 4, 4, '#ff0066', 0);

        ui.drawHUD(game.ctx, [{label:'Счёт',value:score,color:'#00ff00'},{label:'Высота',value:maxHeight+'м',color:'#00ff00'}]);
        ui.drawBrand(game.ctx, game.w, game.h);
    };

    input.on('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') player.vx = -5;
        if (e.key === 'ArrowRight' || e.key === 'd') player.vx = 5;
    });
    input.on('keyup', e => {
        if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) player.vx = 0;
    });
    input.on('touchmove', e => {
        player.vx = e.touches[0].clientX < game.w / 2 ? -5 : 5;
    });
    input.on('touchend', () => { player.vx = 0; });

    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', e => { if (e.gamma) player.vx = e.gamma / 5; });
    }

    input.preventArrowScroll();
    audio.init();

    ui.showStart({
        title: 'ALGOKOSMOS',
        description: 'Doodle Jump — прыгай как можно выше!',
        color: '#00ff00',
        controls: '← → / WASD — движение | Тильт — мобильное управление',
        onStart: () => { player.x = game.w/2; player.y = game.h-100; player.vx=0; player.vy=0; score=0; maxHeight=0; initPlatforms(); game.start(); }
    });
    </script>
</body>
</html>
